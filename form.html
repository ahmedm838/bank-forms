<!doctype html>
<html lang="en">
<head>
<script src="workspace.js?v=51"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABK Transfer Request</title>
<meta name="description" content="Fills the Al Ahli Bank of Kuwait – Egypt transfer / bank draft application and prints into the original PDF.">
<link rel="stylesheet" href="styles.css?v=51">
</head>
<body>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Transfer Request</h1>
    <p>Enter the password to open the form.</p>
    <input id="gatePass" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
    <button type="submit" class="primary">Open</button>
    <div id="gateMsg" role="alert"></div>
  </form>
</div>

<header>
  <a class="back" href="index.html" title="All forms">&#8592;</a>
  <div class="brand">
    <div class="title" id="formTitle">Transfer / Bank Draft Application</div>
    <div class="sub" id="formSub">Al Ahli Bank of Kuwait &ndash; Egypt &nbsp;&middot;&nbsp; fills the original form</div>
  </div>
  <nav class="pagenav">
    <a href="index.html" class="on">Forms</a>
    <a href="banks.html">Banks</a>
    <a href="suppliers.html">Suppliers</a>
    <a href="transactions.html">Transactions</a>
    <a href="defaults.html">Default values</a>
  </nav>
  <div class="spacer"></div>
  <select id="formSwitch" aria-label="Switch form" hidden></select>
  <label class="sizePick">Text size
    <select id="fontSize" aria-label="Text size"></select>
  </label>
  <button id="btnClear" type="button">Clear</button>
  <button id="btnSave" type="button" title="Record this transfer in Transactions, without making a PDF">Save</button>
  <button id="btnPrint" type="button" class="primary">Print</button>
</header>

<main>
  <div id="formPane">
    <div id="editing" class="editing-note" hidden>
      <span></span>
      <a href="transactions.html">Back to transactions</a>
    </div>
    <div id="errors" class="errors" hidden></div>
    <div id="form"></div>
  </div>
  <div id="previewPane">
    <div id="previewWrap">
      <img id="pageImg" alt="Transfer request form preview" src="assets/preview.png">
      <div id="overlay"></div>
    </div>
  </div>
</main>

<div id="toast"></div>
<div id="loading">Loading the form&hellip;</div>
<iframe id="printFrame" title="print"></iframe>

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="vendor/bidi.min.js"></script>
<script src="banks-seed.js?v=51"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="list-files.js?v=51"></script>
<script src="repo-workbooks.js?v=51"></script>
<script src="repo-store.js?v=51"></script>
<script src="data-lists.js?v=51"></script>
<script src="gate.js?v=51"></script>
<script src="forms/abk-transfer.js?v=51"></script>
<script src="forms/abk-cheques.js?v=51"></script>
<script src="forms/abk-cheque-egp.js?v=51"></script>
<script src="forms/abk-payroll.js?v=51"></script>
<script src="forms/abk-payroll-transfer.js?v=51"></script>
<script src="forms/abk-deposit.js?v=51"></script>
<script src="form-registry.js?v=51"></script>
<script src="app.js?v=51"></script>
</body>
</html>
