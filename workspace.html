<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bank Forms</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style>
<script>window.BANK_FORMS_WORKSPACE=true;</script><script src="workspace.js?v=52"></script></head><body>
<details style="position:fixed;right:16px;bottom:12px;z-index:20;background:white;border:1px solid #ccd4df;border-radius:8px;padding:8px;font:14px Arial">
<summary>GitHub connection</summary><p>One token for all saves, remembered in this browser.</p>
<label>Access token <input id="githubToken" type="password" autocomplete="off"></label>
<button id="saveToken">Save connection</button><button id="forgetToken">Forget token</button><p id="connectionStatus" role="status"></p></details>
<iframe id="appFrame" title="Bank Forms workspace"></iframe>
<script>
const tokenInput=document.getElementById('githubToken');
const connectionStatus=document.getElementById('connectionStatus');
function updateConnectionStatus(){connectionStatus.textContent=BankFormsMemory.githubToken?'Connection saved for all pages.':'No saved connection.';}
document.getElementById('saveToken').onclick=()=>{if(!tokenInput.value.trim()){connectionStatus.textContent='Enter a token first.';return;}BankFormsMemory.githubToken=tokenInput.value.trim();tokenInput.value='';updateConnectionStatus();};
document.getElementById('forgetToken').onclick=()=>{BankFormsMemory.githubToken='';tokenInput.value='';updateConnectionStatus();};
updateConnectionStatus();
const view=new URLSearchParams(location.search).get('view') || 'index.html';
const target=new URL(view,location.href);
const pages=new Set(['index.html','form.html','banks.html','suppliers.html','transactions.html','defaults.html','payroll-sheet.html']);
const frame=document.getElementById('appFrame');
window.addEventListener('pagehide',()=>{Object.keys(BankFormsMemory).forEach(key=>delete BankFormsMemory[key]);});
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
frame.src=target.origin===location.origin && pages.has(target.pathname.split('/').pop()) && target.pathname.startsWith(location.pathname.slice(0,location.pathname.lastIndexOf('/')+1)) ? target.href : 'index.html';
frame.addEventListener('load',()=>{
  try{
    const active=new URL(frame.contentWindow.location.href);
    document.title=frame.contentDocument.title;
    if(active.origin===location.origin && pages.has(active.pathname.split('/').pop())){
      history.replaceState(null,'','workspace.html?view='+encodeURIComponent(active.pathname.split('/').pop()+active.search+active.hash));
    }
  }catch(e){}
});
</script></body></html>
